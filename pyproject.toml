[project]
name = "chat-hacksman"
version = "0.8.0"
description = "Web chatbot with optional multi-source Qdrant RAG and local LLM providers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Romkey" }]
# Keep in step with .python-version and the Dockerfile's python image.
requires-python = ">=3.15"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "httpx>=0.28.0",
  "qdrant-client>=1.14.0",
  "sentry-sdk>=2.54.0",
]

[project.urls]
Homepage = "https://github.com/romkey/pdxhackerspace-chat-hacksman"
Changelog = "https://github.com/romkey/pdxhackerspace-chat-hacksman/blob/main/CHANGELOG.md"
Issues = "https://github.com/romkey/pdxhackerspace-chat-hacksman/issues"

[project.scripts]
chat-hacksman = "chat_hacksman.__main__:main"

[dependency-groups]
dev = [
  "mypy>=2.4.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
  "E", "W", "F",  # pycodestyle, pyflakes
  "I",            # import order
  "N",            # naming
  "UP",           # modern syntax for requires-python
  "B",            # likely bugs
  "S",            # security
  "C4", "SIM", "RET", "PTH",
  "DTZ",          # timezone-aware datetimes
  "T20",          # no print(); use logging
  "LOG", "G",     # logging calls
  "PT",           # pytest style
  "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works
"scripts/**" = ["T20"]  # command-line tools print

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
addopts = ["--cov", "--cov-report=term-missing", "--strict-markers"]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
source = ["chat_hacksman"]
branch = true

[tool.coverage.report]
fail_under = 80
skip_covered = true
exclude_also = ['if __name__ == "__main__":']
