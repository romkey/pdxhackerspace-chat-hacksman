# Production: runs the released image from ghcr.io. Configure it in .env
# next to this file (see .env.example and docs/configuration.md).
#
#   docker compose -f docker-compose.prod.yaml up -d
#   APP_VERSION=1.2.3 docker compose -f docker-compose.prod.yaml up -d   # pin a release
#   docker compose -f docker-compose.prod.yaml build   # build the image locally instead

services:
  app:
    image: ghcr.io/romkey/pdxhackerspace-chat-hacksman:${APP_VERSION:-latest}
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    # Chat history, settings and the events feed (SQLite).
    volumes:
      - chat-hacksman-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Least privilege: nothing to write but /tmp, no capabilities.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Optional local Qdrant, if you don't already run one. Set
  # QDRANT_URL=http://qdrant:6333 in .env.
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   restart: unless-stopped
  #   volumes:
  #     - qdrant-data:/qdrant/storage

volumes:
  chat-hacksman-data:
  # qdrant-data:
